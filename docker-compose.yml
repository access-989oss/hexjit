services:

  postgres:
    image: postgres:17
    container_name: hexjit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hexjit
      POSTGRES_USER: hexjit
      POSTGRES_PASSWORD: HexjitDB_2026!Dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hexjit-network

  redis:
    image: redis:8-alpine
    container_name: hexjit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hexjit-network

networks:
  hexjit-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
